# Deploy config for git-deploy-toolkit (github.com/WentTheFox/GitDeployToolkit).
# Sourced by the shared post-receive hook after each push to `deploy`,
# with cwd set to this worktree. See that repo's template/deploy.conf.example
# for the full contract ($WORKTREE/$BRANCH/$GIT_DIR/$oldrev/$newrev).
#
# Changing pm2.json's script or exec_mode needs `pm2 delete Celestia && pm2 start pm2.json` once: a reload applies the new
# script to the old process, which then crashes (it did, when the app went from a forked `pnpm start` to the two instance cluster).
#
# Ported from this repo's old setup/post-receive.sh (a hand-rolled hook on
# a non-bare `production` remote with receive.denyCurrentBranch=updateInstead).
# That script unconditionally ran `pnpm install` then `pnpm build` (via
# turbo) on every push regardless of which files changed, and aborted
# (exit 1) on a build failure without ever restarting the pm2 process —
# same behavior kept here. `pnpm reload` (turbo -> apps/celestia's own
# "reload" script) runs `pm2 reload pm2.json`, which reloads the existing
# "Celestia" pm2 process in place (zero-downtime reload, not a fresh
# start) — no PM2 naming collision risk here since there's only ever one
# worktree of this app.

deploy_build() {
  pnpm install --frozen-lockfile
  # The build goes into its own directory, so the running app keeps serving the previous build from .next until deploy_restart swaps them
  # (building in place removed the files the running app was serving: pages and assets answered 500 for the minutes the build took)
  rm -rf apps/celestia/.next-new
  # Tell next.config.js which commit this is (its build ID), read from the
  # bare repo: this worktree isn't a git repo, and a stale .git left here by
  # the old deploy setup made builds report its commit instead
  local info
  info=$(git --git-dir="$GIT_DIR" log -1 --pretty='%h;%ct' "$newrev")
  NEXT_DIST_DIR=.next-new BUILD_GIT_INFO="$info" nice pnpm build
  # The running server loads next.config.js again without this environment, and without it would invent a different build ID and
  # deployment ID than the one the pages were built with (every client-side navigation then forces a full page load): the build records its own
  echo "$info" > apps/celestia/.next-new/BUILD_GIT_INFO
}

deploy_restart() {
  # Two renames, then the reload: the gap is the pm2 restart only (nginx shows setup/updating.html meanwhile)
  cd apps/celestia
  rm -rf .next-old
  [ -d .next ] && mv .next .next-old
  mv .next-new .next
  cd ../..
  pnpm reload # a rolling reload of the pm2 cluster: one instance restarts at a time
  rm -rf apps/celestia/.next-old
}
