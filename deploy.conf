# Deploy config for git-deploy-toolkit (github.com/WentTheFox/GitDeployToolkit).
# Sourced by the shared post-receive hook after each push to `deploy`,
# with cwd set to this worktree. See that repo's template/deploy.conf.example
# for the full contract ($WORKTREE/$BRANCH/$GIT_DIR/$oldrev/$newrev).
#
# Ported from this repo's old setup/post-receive.sh (a hand-rolled hook on
# a non-bare `production` remote with receive.denyCurrentBranch=updateInstead).
# That script unconditionally ran `pnpm install` then `pnpm build` (via
# turbo) on every push regardless of which files changed, and aborted
# (exit 1) on a build failure without ever restarting the pm2 process —
# same behavior kept here. `pnpm reload` (turbo -> apps/celestia's own
# "reload" script) runs `pm2 reload pm2.json`, which reloads the existing
# "Celestia" pm2 process in place (zero-downtime reload, not a fresh
# start) — no PM2 naming collision risk here since there's only ever one
# worktree of this app.

deploy_build() {
  pnpm install --frozen-lockfile
  nice pnpm build
}

deploy_restart() {
  pnpm reload
}
