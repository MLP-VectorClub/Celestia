packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  core-js: true
  es5-ext: true
  sharp: false
  unrs-resolver: true

minimumReleaseAge: 20160
minimumReleaseAgeExclude:
  # Published by Luna's own workflow (with provenance), so there is nothing to wait out
  - '@went.tf/mlp-vectorclub-api-types'
