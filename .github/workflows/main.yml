name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize]

jobs:
  build:
    name: 'Build, Linting and Unit Tests'
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    env:
      NEXT_PUBLIC_API_PREFIX: /api
      NEXT_PUBLIC_BACKEND_HOST: https://api.example.com
      NEXT_PUBLIC_CDN_DOMAIN: cdn.example.com
      NEXT_PUBLIC_FRONTEND_HOST: https://example.com
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.6

      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @mlp-vectorclub/celestia exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Linting
        run: pnpm lint

      - name: Unit Tests
        run: pnpm test:coverage

      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: |
          jq -r '.total as $t | "## Coverage\n\n| Metric | Covered | Total | % |\n|---|---|---|---|\n" +
            ([ "lines", "statements", "functions", "branches" ] | map("| \(.) | \($t[.].covered) | \($t[.].total) | \($t[.].pct)% |") | join("\n"))' \
            apps/celestia/coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: apps/celestia/coverage

  e2e:
    name: 'End-to-end Tests'
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.6

      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @mlp-vectorclub/celestia exec playwright install --with-deps chromium

      # Builds the app and starts it next to the stub API, see apps/celestia/playwright.config.ts
      - name: End-to-end Tests
        run: pnpm --filter @mlp-vectorclub/celestia test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: apps/celestia/test-results
          if-no-files-found: ignore
