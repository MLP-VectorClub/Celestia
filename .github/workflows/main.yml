name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize]

jobs:
  build:
    name: 'Build, Linting and Unit Tests'
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    env:
      API_JSON_PATH: ${{ secrets.API_JSON_PATH }}
      NEXT_PUBLIC_API_PREFIX: /api
      NEXT_PUBLIC_BACKEND_HOST: https://api.example.com
      NEXT_PUBLIC_CDN_DOMAIN: cdn.example.com
      NEXT_PUBLIC_FRONTEND_HOST: https://example.com
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.5.2

      - name: Setup Node.js environment
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @mlp-vectorclub/celestia exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Linting
        run: pnpm lint

      - name: Unit Tests
        run: pnpm test:coverage

      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: |
          jq -r '.total as $t | "## Coverage\n\n| Metric | Covered | Total | % |\n|---|---|---|---|\n" +
            ([ "lines", "statements", "functions", "branches" ] | map("| \(.) | \($t[.].covered) | \($t[.].total) | \($t[.].pct)% |") | join("\n"))' \
            apps/celestia/coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: apps/celestia/coverage
